<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1. 디지털 리터러시 — 내 피드는 내가 고른 걸까?</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#1c2230; --ink-2:#4b5563; --ink-3:#8a94a6;
  --paper:#ffffff; --bg:#f3f5f9; --line:#d9dee8; --line-2:#eceff4;
  --blue:#2457d6; --blue-soft:#e9effc; --blue-ink:#1a3f9e;
  --a:#2f6fed; --a-soft:#e8f0ff; --b:#e0457b; --b-soft:#fdeaf1;
  --ok:#1f8f5f; --ok-soft:#e5f5ec; --warn:#b45309; --warn-soft:#fff4e5;
  --radius:10px;
  --font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
textarea,input,select{font-family:inherit;font-size:15px;color:var(--ink)}

/* ---------- 앱 레이아웃 ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.rail{background:var(--paper);border-right:1px solid var(--line);padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto}
.rail .unit{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.rail .title{font-size:17px;font-weight:700;line-height:1.35;margin:0 0 18px}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:8px;color:var(--ink-3);font-size:14px;cursor:default}
.steps li .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none;background:var(--paper)}
.steps li.done{color:var(--ink-2);cursor:pointer}
.steps li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.current{color:var(--blue-ink);background:var(--blue-soft);font-weight:600}
.steps li.current .n{border-color:var(--blue);color:var(--blue)}
.steps li.done:hover{background:var(--line-2)}
.rail .who{margin-top:22px;padding-top:16px;border-top:1px solid var(--line-2)}
.rail .who label{display:block;font-size:12px;color:var(--ink-3);margin:8px 0 3px}
.rail .who input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px}
.rail .tools{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.rail .save{font-size:12px;color:var(--ink-3);margin-top:10px;min-height:18px}

.main{padding:34px 40px 80px;max-width:820px;width:100%}
.stage{display:none}
.stage.active{display:block}
.stage h1{font-size:26px;line-height:1.3;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.stage h1 small{display:block;font-size:13px;color:var(--ink-3);font-weight:500;margin-bottom:6px;letter-spacing:0}
.stage .lead{color:var(--ink-2);margin:0 0 22px}
.stage h2{font-size:18px;margin:34px 0 10px;font-weight:700;letter-spacing:-.005em}
.stage h3{font-size:15.5px;margin:22px 0 8px;font-weight:700}
.stage p{margin:0 0 10px}
.stage .note{font-size:13px;color:var(--ink-3)}

/* 핵심 질문 */
.kq{border-left:4px solid var(--blue);background:var(--paper);padding:14px 18px;border-radius:0 var(--radius) var(--radius) 0;margin:10px 0 24px;font-weight:600;color:var(--blue-ink);line-height:1.55}
.kq .tag{display:block;font-size:12px;font-weight:600;color:var(--blue);margin-bottom:4px}

/* 정보 박스 */
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:12px 0}
.box.tint{background:var(--blue-soft);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.concept{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:12px 0}
.concept b.t{display:block;font-size:16px;margin-bottom:6px}

/* 피드 카드 */
.shared{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius);padding:12px 14px;margin:10px 0 14px}
.shared .thumb{width:64px;height:44px;border-radius:6px;background:linear-gradient(135deg,#25304a,#4a5a85);flex:none;display:grid;place-items:center;color:#fff;font-size:11px}
.feeds{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phone{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper)}
.phone .ph{padding:10px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.phone.a .ph{background:var(--a-soft);color:var(--a)}
.phone.b .ph{background:var(--b-soft);color:var(--b)}
.phone .badge{width:22px;height:22px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:12px}
.phone.a .badge{background:var(--a)}.phone.b .badge{background:var(--b)}
.phone ul{list-style:none;margin:0;padding:6px 10px 8px}
.phone li{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line-2);font-size:13.5px}
.phone li:last-child{border-bottom:0}
.phone li .th{width:44px;height:30px;border-radius:5px;background:#e3e7f0;flex:none;position:relative}
.phone li .th::after{content:attr(data-t);position:absolute;right:2px;bottom:2px;font-size:9px;background:rgba(0,0,0,.65);color:#fff;padding:0 3px;border-radius:3px}
.phone .keys{padding:8px 12px 12px;display:flex;gap:6px;flex-wrap:wrap}
.phone .keys span{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid}
.phone.a .keys span{color:var(--a);border-color:var(--a)}
.phone.b .keys span{color:var(--b);border-color:var(--b)}
.phone li .acts{margin-left:auto;display:flex;gap:4px;flex:none}
.phone li .acts i{font-style:normal;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--blue-soft);color:var(--blue-ink)}
.phone li .acts i.like{background:#fde7ee;color:#b81f56}
.phone li .acts i.again{background:#e3f6ec;color:#146c47}
.phone li .acts i.skip{background:#eceff4;color:var(--ink-3)}

/* 추천 신호 그림 */
.signals{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 6px}
.signals .s{padding:8px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--line);font-size:13.5px}
.signals .arrow{color:var(--ink-3)}
.signals .q{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.signals .out{background:var(--blue-soft);border-color:transparent;color:var(--blue-ink);font-weight:600}

/* 단서 */
.clue{border:1.5px solid var(--line);border-radius:var(--radius);margin:14px 0;background:var(--paper);overflow:hidden}
.clue .ch{display:flex;align-items:center;gap:12px;padding:14px 18px}
.clue .ch b{font-size:15.5px}
.clue .ch .st{font-size:12.5px;color:var(--ink-3)}
.clue .ch button{margin-left:auto}
.clue .cb{display:none;padding:0 18px 18px;border-top:1px solid var(--line-2)}
.clue.open .cb{display:block}
.clue.open{border-color:var(--blue)}
.clue.open .ch .st{color:var(--ok)}

/* 질문 */
.q{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:14px 0}
.q .ql{font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.q .ql .no{color:var(--blue);flex:none}
.q .qh{font-size:13.5px;color:var(--ink-2);margin:-4px 0 10px}
.q textarea{width:100%;min-height:78px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;resize:vertical;line-height:1.55;background:#fbfcfe}
.q input[type=text]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fbfcfe}
.q textarea:focus,.q input:focus,.q select:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.row{flex-direction:row;flex-wrap:wrap;gap:8px 16px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.opt:hover{background:var(--line-2)}
.opt input{margin-top:4px;accent-color:var(--blue)}
.opt.sel{background:var(--blue-soft);border-color:#c7d5f7}
.opt .etc{flex:1;padding:4px 8px;border:0;border-bottom:1px solid var(--line);background:transparent}
.blank{line-height:2.3}
.blank input{width:min(100%,340px);padding:4px 8px;border:0;border-bottom:1.5px solid var(--ink-3);background:transparent;border-radius:0;margin:0 4px}
.blank input:focus{outline:0;border-bottom-color:var(--blue)}
.blank input.long{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .lab{font-size:13px;font-weight:600;margin-bottom:4px;color:var(--ink-2)}
.grid2 .lab.a{color:var(--a)}.grid2 .lab.b{color:var(--b)}
.mtx{width:100%;border-collapse:collapse;font-size:14px}
.mtx th,.mtx td{border:1px solid var(--line);padding:9px 10px;text-align:center}
.mtx td:first-child,.mtx th:first-child{text-align:left}
.mtx input{accent-color:var(--blue)}
.mtx th{background:var(--line-2);font-weight:600;font-size:13px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare .col{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.compare .col .k{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.compare .col .v{font-weight:600}
.compare .col .v.empty{color:var(--ink-3);font-weight:400}

/* 잠금 */
.stage.locked .q,.stage.locked .clue{position:relative}
.stage.locked textarea,.stage.locked input,.stage.locked select{background:#f5f7fa;color:var(--ink-2)}
.stage.locked .opt{cursor:default}
.lockbar{display:flex;gap:10px;align-items:center;background:var(--ok-soft);color:#125c3c;border-radius:8px;padding:9px 14px;font-size:13.5px;margin:0 0 18px}
.lockbar::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}

/* 버튼 */
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{background:var(--line-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{border-color:transparent;color:var(--ink-3)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.nav .hint{font-size:13px;color:var(--ink-3)}

/* 모바일 상단 스텝 */
.mstep{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px}
  .rail .steps{display:flex;gap:4px;overflow:auto;padding-bottom:4px}
  .rail .steps li{flex:none;padding:6px 10px;font-size:13px}
  .rail .steps li .lbl{display:none}
  .rail .steps li.current .lbl{display:inline}
  .rail .who{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:0;margin-top:10px;padding-top:0}
  .rail .tools{flex-direction:row;flex-wrap:wrap;margin-top:12px}
  .main{padding:22px 16px 60px}
  .two,.feeds,.grid2,.compare{grid-template-columns:1fr}
  .stage h1{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){
  .clue .cb{animation:none}
}

/* ---------- 인쇄 뷰 ---------- */
#printView{display:none}
@media print{
  @page{size:A4;margin:16mm 15mm}
  body{background:#fff;font-size:11.5pt;color:#000}
  .app{display:none!important}
  #printView{display:block}
  .pv h1{font-size:17pt;margin:0 0 2pt}
  .pv .meta{font-size:10pt;color:#444;margin-bottom:10pt;display:flex;justify-content:space-between;border-bottom:1.5px solid #000;padding-bottom:6pt}
  .pv .kq{border-left:3pt solid #2457d6;padding:5pt 9pt;margin:6pt 0 10pt;font-weight:600;background:none;border-radius:0}
  .pv h2{font-size:13pt;margin:14pt 0 5pt;padding-bottom:3pt;border-bottom:1px solid #999;break-after:avoid}
  .pv h3{font-size:11.5pt;margin:9pt 0 4pt;break-after:avoid}
  .pv .item{margin:0 0 7pt;break-inside:avoid}
  .pv .item .l{font-weight:600;font-size:10.5pt;color:#333}
  .pv .item .v{border:1px solid #bbb;padding:5pt 7pt;min-height:22pt;white-space:pre-wrap;margin-top:2pt;border-radius:3pt}
  .pv .item .v.inline{border:0;padding:0;min-height:0;margin-top:0;display:inline;white-space:normal}
  .pv .item .v .blank{border-bottom:1px solid #000;padding:0 4pt;font-weight:600}
  .pv .item .v .blank.empty{color:#999;font-weight:400}
  .pv .empty{color:#999}
  .pv .stamp{font-size:9pt;color:#666;margin-left:6pt;font-weight:400}
  .pv table{width:100%;border-collapse:collapse;font-size:10.5pt;margin:4pt 0 8pt}
  .pv th,.pv td{border:1px solid #999;padding:4pt 6pt;vertical-align:top}
  .pv th{background:#eee;text-align:left}
  .pv .summary{border:1.5px solid #000;padding:8pt 10pt;margin:10pt 0 4pt;break-inside:avoid}
  .pv .summary h2{border:0;margin:0 0 6pt;padding:0}
  .pv .pb{break-before:page}
  .pv .two{display:grid;grid-template-columns:1fr 1fr;gap:8pt}
}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="unit">고등학교 AI 윤리 · 1차시</div>
    <h1 class="title">내 피드는<br>내가 고른 걸까?</h1>
    <ul class="steps" id="steps"></ul>
    <div class="who">
      <label for="cls">학번</label><input id="cls" data-key="meta.cls" placeholder="예: 10315">
      <label for="nm">이름</label><input id="nm" data-key="meta.name" placeholder="이름">
    </div>
    <div class="tools">
      <button class="btn" id="btnPrint">PDF로 저장</button>
      <button class="btn ghost sm" id="btnReset">처음부터 다시 하기</button>
      <div class="save" id="saveMsg"></div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div id="printView"></div>

<script>
/* =====================================================================
   활동지 정의 — 교재(학생용 V3, 1. 디지털 리터러시)의 장 구조를 그대로 옮김
   ===================================================================== */
const STAGES = [
/* ---------------- 1. 주제 만나기 ---------------- */
{
  id:"s1", short:"주제 만나기", title:"1. 주제 만나기", sub:"디지털 리터러시",
  blocks:[
    {kind:"kq", html:"추천이 내 취향을 잘 맞혀 주는 편리함을 누리면서도 한쪽 정보에만 갇히지 않으려면 이용자와 플랫폼은 어떤 기준을 지켜야 할까?"},
    {kind:"h2", text:"생각 열기 — 같은 영상을 봤는데, 왜 다음 피드는 달라졌을까?"},
    {kind:"html", html:`
      <p>이번 주 공개될 가상의 미스터리 드라마 「제로아워」가 SNS에서 화제입니다. 아직 작품을 보지 않은 A와 B는 모아뷰에서 <b>같은 예고편 분석 영상</b>을 끝까지 봤습니다.</p>
      <div class="shared"><div class="thumb">0:50</div><div><b>《제로아워》, 진짜 그렇게 재밌을까?</b><div class="note">호평과 아쉬운 평가를 함께 소개하는 50초 리뷰 — A와 B가 둘 다 시청</div></div></div>
      <div class="feeds">
        <div class="phone a"><div class="ph"><span class="badge">A</span>A의 다음 피드</div>
          <ul>
            <li><span class="th" data-t="0:42"></span>《제로아워》를 끝까지 봐야 하는 이유 5가지</li>
            <li><span class="th" data-t="0:55"></span>다시 보면 보이는 소름 돋는 복선</li>
            <li><span class="th" data-t="0:47"></span>배우들의 연기가 좋았던 장면</li>
            <li><span class="th" data-t="1:02"></span>결말은 아쉽다는 의견도 있다?</li>
            <li><span class="th" data-t="0:58"></span>비슷한 미스터리 작품 추천</li>
          </ul>
          <div class="keys"><span>관람 이유</span><span>숨은 복선</span><span>결말 의견</span></div>
        </div>
        <div class="phone b"><div class="ph"><span class="badge">B</span>B의 다음 피드</div>
          <ul>
            <li><span class="th" data-t="0:47"></span>《제로아워》, 정말 그렇게 잘 만든 작품일까?</li>
            <li><span class="th" data-t="0:52"></span>시청자들이 아쉽다고 한 설정 4가지</li>
            <li><span class="th" data-t="0:49"></span>화제성에 비해 평가가 엇갈리는 이유</li>
            <li><span class="th" data-t="1:01"></span>그래도 연출은 뛰어나다는 평가</li>
            <li><span class="th" data-t="0:54"></span>비슷한 장르의 다른 작품과 비교</li>
          </ul>
          <div class="keys"><span>작품 완성도</span><span>아쉬운 설정</span><span>엇갈린 평가</span></div>
        </div>
      </div>`},
    {kind:"h2", text:"먼저 생각해 보기"},
    {kind:"field", key:"s1.clue", no:"①", label:"첫 번째 단서를 찾아보세요", help:"A와 B의 피드에서 반복해서 보이는 콘텐츠와 서로 다른 점을 찾아 적어 보세요.", type:"line", placeholder:"내가 찾은 첫 번째 단서"},
    {kind:"field", key:"s1.judge", no:"②", label:"사건 추리 — 지금 가장 의심되는 것은?", help:"현재 정보만 보고 가장 가능성이 높다고 생각하는 설명 하나를 골라 보세요.", type:"radio", required:true, options:[
      "A와 B가 이전에 한 행동이 달랐기 때문이다.",
      "모아뷰가 이용 행동을 추천 신호로 반영했기 때문이다.",
      "처음부터 두 사람에게 추천될 수 있는 콘텐츠가 달랐기 때문이다.",
      "아직 단서를 더 봐야 한다.",
      {etc:"다른 설명"}]},
    {kind:"field", key:"s1.judgeWhy", label:"그렇게 생각한 이유", type:"text"},
    {kind:"field", key:"s1.need", no:"③", label:"무엇을 확인해야 할까?", help:"어떤 단서가 필요할까요? 필요한 단서에 표시하세요.", type:"check", options:[
      "단서 1 — A와 B가 무엇을 보고 어떻게 반응했는지",
      "단서 2 — 모아뷰가 어떤 행동을 추천 신호로 보는지",
      "단서 3 — 처음 두 사람에게 추천될 수 있었던 콘텐츠가 무엇이었는지"]},
    {kind:"field", key:"s1.first", label:"가장 먼저 보고 싶은 단서", type:"radio", inline:true, options:["단서 1","단서 2","단서 3"]}
  ]
},
/* ---------------- 2. 근거 탐구하기 ---------------- */
{

{
  id:"s3", short:"개념으로 다시 보기", title:"3. 개념으로 다시 보기", sub:"추천된 정보 속에서, 나는 무엇을 선택할까?",
  lead:"앞에서 A와 B의 이용 행동과 추천 결과를 연결해 보았습니다. 그런데 비슷한 추천이 계속되면 어떤 정보는 자주 보이고, 다른 정보는 잘 보이지 않을 수도 있습니다. 이런 현상을 ‘필터 버블’과 ‘지적 주권’이라는 개념으로 다시 살펴봅시다.",
  blocks:[
    {kind:"html", html:`<div class="concept"><b class="t">핵심 개념 1. 필터 버블</b>
      <p>필터 버블은 개인화 추천으로 비슷한 정보가 반복해서 제시되면서, 다른 주제나 관점을 접할 기회가 줄어들 수 있는 현상을 말합니다.</p>
      <p style="margin:0">개인화 추천이 항상 필터 버블을 만드는 것은 아닙니다. 추천되는 정보의 범위, 이용자의 선택, 서비스의 설계 등에 따라 결과는 달라질 수 있습니다.</p></div>`},
    {kind:"h3", text:"앞의 사례에서는?"},
    {kind:"html", html:`<p>A와 B에게 비슷한 유형의 콘텐츠가 계속 추천된다면, 각각 어떤 정보는 더 자주 보고 어떤 정보는 덜 보게 될 수 있을까요?</p>`},
    {kind:"pair", title:"", la:"A", lb:"B", a:[
        {key:"s3.aMore", label:"더 자주 보게 될 수 있는 정보", type:"line"},
        {key:"s3.aLess", label:"덜 보게 될 수 있는 정보", type:"line"}],
      b:[
        {key:"s3.bMore", label:"더 자주 보게 될 수 있는 정보", type:"line"},
        {key:"s3.bLess", label:"덜 보게 될 수 있는 정보", type:"line"}]},
    {kind:"html", html:`<div class="concept"><b class="t">핵심 개념 2. 지적 주권</b>
      <p>지적 주권은 내가 접하는 정보를 추천 시스템에만 맡기지 않고, 무엇을 볼지 스스로 탐색·선택하고 여러 관점을 확인하며 판단할 수 있는 능력과 권리를 뜻합니다.</p>
      <p style="margin:0">추천을 이용하지 않는 것이 지적 주권은 아닙니다. 추천의 편리함을 활용하되 필요할 때 추천 목록 밖의 정보도 직접 찾아보고 선택할 수 있어야 합니다.</p></div>`},
    {kind:"h2", text:"개념 적용하기 — 두 개념 연결하기"},

    {kind:"field", key:"s3.sov", label:"그 상황에서 지적 주권을 지키기 위해 할 수 있는 선택은?", type:"text"}
  ]
},

    {kind:"field", key:"s6.one", no:"③", label:"오늘의 질문에 한 문장으로 답한다면", help:"“내 피드는 내가 고른 걸까?”에 대해 지금의 나는 이렇게 답하겠다.", type:"text"},
    {kind:"h2", text:"스스로 확인하기"},
    {kind:"matrix", key:"s6.self", cols:["충분히 수행함","대체로 수행함","보완 필요"], rows:[
      "A와 B의 이용 흔적과 추천 결과를 연결하여 피드가 달라진 이유를 추론하였다.",
      "필터 버블과 지적 주권을 활용하여 추천 환경 속 정보 선택을 판단하였다.",
      "이용자와 플랫폼이 지켜야 할 기준을 근거를 바탕으로 제안하였다."]}
  ]
}
];

/* =====================================================================
   상태
   ===================================================================== */
const KEY="ai-ethics-01-digital-literacy";
let S = load();
function blank(){ return {answers:{}, current:0, locked:[], clues:{}, stamps:{}, meta:{}}; }
function load(){ try{ const j=JSON.parse(localStorage.getItem(KEY)); if(j&&j.answers) return Object.assign(blank(),j);}catch(e){} return blank(); }
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); const d=new Date(); msg(`자동 저장됨 ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`);}catch(e){ msg("저장 실패: 브라우저 저장 공간을 확인하세요."); } },250); }
function msg(t){ document.getElementById("saveMsg").textContent=t; }
const pad=n=>String(n).padStart(2,"0");
const get=k=>S.answers[k];
const set=(k,v)=>{ S.answers[k]=v; save(); };
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

/* =====================================================================
   렌더링
   ===================================================================== */
const main=document.getElementById("main");
function render(){
  main.innerHTML="";
  STAGES.forEach((st,i)=>{
    const sec=document.createElement("section");
    sec.className="stage"+(i===S.current?" active":"")+(S.locked.includes(i)?" locked":"");
    sec.dataset.i=i;
    let h=`<h1><small>${esc(st.sub||"")}</small>${esc(st.title)}</h1>`;
    if(S.locked.includes(i)) h+=`<div class="lockbar">이 단계는 ${esc(S.stamps[st.id]||"")}에 제출되어 잠겼습니다. 답은 읽기만 할 수 있습니다.</div>`;
    if(st.lead) h+=`<p class="lead">${esc(st.lead)}</p>`;
    h+=st.blocks.map(b=>renderBlock(b,st,i)).join("");
    h+=renderNav(i);
    sec.innerHTML=h;
    main.appendChild(sec);
  });
  bind();
  renderSteps();
  applyGates();
  if(S.current===5) renderCompare();
  window.scrollTo({top:0});
}
function renderBlock(b,st,i){
  const g=b.gated?` data-gated="1"`:"";
  switch(b.kind){
    case "kq": return `<div class="kq"><span class="tag">핵심 질문</span>${b.html}</div>`;
    case "h2": return `<h2${g}>${esc(b.text)}</h2>`;
    case "h3": return `<h3${g}>${esc(b.text)}</h3>`;
    case "html": return `<div${g}>${b.html}</div>`;
    case "field": return `<div class="q"${g}>${fieldHead(b)}${fieldInput(b)}</div>`;
    case "pair": return `<div class="q"${g}>${b.title?`<div class="ql">${esc(b.title)}</div>`:""}<div class="grid2">
        <div><div class="lab a">${esc(b.la||"제출물 A · A의 추천 경로 추리").replace("제출물 A · ","")}</div>${b.a.map(f=>`<div style="margin-bottom:10px">${f.label?`<div class="qh">${esc(f.label)}</div>`:""}${fieldInput(f)}</div>`).join("")}</div>
        <div><div class="lab b">${esc(b.lb||"B의 추천 경로 추리")}</div>${b.b.map(f=>`<div style="margin-bottom:10px">${f.label?`<div class="qh">${esc(f.label)}</div>`:""}${fieldInput(f)}</div>`).join("")}</div></div></div>`;
    case "clue": {
      const open=!!S.clues[b.id];
      return `<div class="clue${open?" open":""}" data-clue="${b.id}"><div class="ch"><b>${esc(b.title)}</b><span class="st">${open?"확인함":"아직 열지 않음"}</span>${open?"":`<button class="btn sm primary" data-open="${b.id}">단서 열기</button>`}</div>
        <div class="cb">${b.html}${b.fields.map(f=>`<div class="q" style="margin-bottom:0">${fieldHead(f)}${fieldInput(f)}</div>`).join("")}</div></div>`;
    }
    case "gate": return `<div class="box tint" data-gatebox="1" data-need="${b.need.join(",")}">${esc(b.html)}</div>`;
    case "matrix": return `<div class="q"${g}><table class="mtx"><thead><tr><th>확인할 내용</th>${b.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>
      ${b.rows.map((r,ri)=>`<tr><td>${esc(r)}</td>${b.cols.map((c,ci)=>`<td><input type="radio" name="${b.key}.${ri}" data-key="${b.key}.${ri}" value="${esc(c)}" ${get(b.key+"."+ri)===c?"checked":""}></td>`).join("")}</tr>`).join("")}
      </tbody></table></div>`;
    case "compare": return `<div class="q"><div class="ql">처음 판단과 지금 판단</div><div class="compare" id="cmp"></div></div>`;
  }
  return "";
}
function fieldHead(b){ return `${b.label?`<div class="ql">${b.no?`<span class="no">${esc(b.no)}</span>`:""}<span>${esc(b.label)}</span></div>`:""}${b.help?`<div class="qh">${esc(b.help)}</div>`:""}`; }
function fieldInput(b){
  const v=get(b.key);
  switch(b.type){
    case "text": return `<textarea data-key="${b.key}" rows="${b.rows||3}" placeholder="${esc(b.placeholder||"")}">${esc(v||"")}</textarea>`;
    case "line": return `<input type="text" data-key="${b.key}" value="${esc(v||"")}" placeholder="${esc(b.placeholder||"")}">`;
    case "radio": {
      const cur=v||{};
      return `<div class="opts${b.inline?" row":""}">${b.options.map((o,oi)=>{
        const isEtc=typeof o==="object"; const val=isEtc?"__etc__":o;
        const sel=(cur.value===val);
        return `<label class="opt${sel?" sel":""}"><input type="radio" name="${b.key}" data-key="${b.key}" data-type="radio" value="${esc(val)}" ${sel?"checked":""}>
          ${isEtc?`<span style="flex:none">${esc(o.etc)}:</span><input class="etc" type="text" data-etc="${b.key}" value="${esc(cur.etc||"")}" placeholder="직접 쓰기">`:`<span>${esc(o)}</span>`}</label>`;}).join("")}</div>`;
    }
    case "check": {
      const cur=v||{values:[],etc:""};
      return `<div class="opts">${b.options.map(o=>{
        const isEtc=typeof o==="object"; const val=isEtc?"__etc__":o; const sel=cur.values.includes(val);
        return `<label class="opt${sel?" sel":""}"><input type="checkbox" data-key="${b.key}" data-type="check" data-max="${b.max||0}" value="${esc(val)}" ${sel?"checked":""}>
          ${isEtc?`<span style="flex:none">${esc(o.etc)}:</span><input class="etc" type="text" data-etc="${b.key}" value="${esc(cur.etc||"")}" placeholder="직접 쓰기">`:`<span>${esc(o)}</span>`}</label>`;}).join("")}</div>`;
    }
    case "blank": {
      const parts=b.tpl.split("___"); const cur=Array.isArray(v)?v:[];
      let out=`<div class="blank">`;
      parts.forEach((p,pi)=>{ out+=esc(p).replace(/\n/g,"<br>"); if(pi<parts.length-1) out+=`<input type="text" data-key="${b.key}" data-type="blank" data-idx="${pi}" value="${esc(cur[pi]||"")}">`; });
      return out+"</div>";
    }
  }
  return "";
}
function renderNav(i){
  const last=i===STAGES.length-1, locked=S.locked.includes(i);
  return `<div class="nav">
    <div>${i>0?`<button class="btn" data-go="${i-1}">이전 단계 보기</button>`:""}</div>
    <div class="hint">${locked?"":"제출하면 이 단계의 답은 고정됩니다."}</div>
    <div>${locked?(last?`<button class="btn primary" id="btnPrint2">PDF로 저장</button>`:`<button class="btn primary" data-go="${i+1}">다음 단계 보기</button>`):
      (last?`<button class="btn primary" data-submit="${i}">제출하고 PDF 만들기</button>`:`<button class="btn primary" data-submit="${i}">제출하고 다음 단계로</button>`)}</div></div>`;
}
function renderSteps(){
  const ul=document.getElementById("steps"); ul.innerHTML="";
  STAGES.forEach((st,i)=>{
    const li=document.createElement("li");
    const done=S.locked.includes(i);
    li.className=(done?"done":"")+(i===S.current?" current":"");
    li.innerHTML=`<span class="n">${done?"✓":i+1}</span><span class="lbl">${esc(st.short)}</span>`;
    if(done||i===S.current||i<=Math.max(...S.locked,-1)+1) li.addEventListener("click",()=>{ if(done||i===S.current){S.current=i;save();render();} });
    ul.appendChild(li);
  });
}
function applyGates(){
  document.querySelectorAll("[data-gatebox]").forEach(gb=>{
    const need=gb.dataset.need.split(","); const ok=need.every(c=>S.clues[c]);
    gb.style.display=ok?"none":"";
    gb.closest(".stage").querySelectorAll("[data-gated]").forEach(el=>el.style.display=ok?"":"none");
  });
  document.querySelectorAll(".stage.locked").forEach(sec=>sec.querySelectorAll("textarea,input,select,button[data-open]").forEach(el=>{ if(!el.closest(".nav")) el.disabled=true; }));
}
function renderCompare(){
  const el=document.getElementById("cmp"); if(!el) return;
  const first=get("s1.judge"), fin=get("s4.mine");
  const txt=(r,q)=>{ if(!r||!r.value) return `<span class="empty">(미입력)</span>`; if(r.value==="__etc__") return esc(r.etc||"(다른 설명)"); return esc(r.value); };
  el.innerHTML=`<div class="col"><div class="k">1단계 · 처음 판단 (${esc(S.stamps.s1||"")})</div><div class="v">${txt(first)}</div><div class="k" style="margin-top:8px">이유</div><div class="v ${get("s1.judgeWhy")?"":"empty"}">${esc(get("s1.judgeWhy")||"(미입력)")}</div></div>
  <div class="col"><div class="k">4단계 · 근거로 판단 (${esc(S.stamps.s4||"")})</div><div class="v">${txt(fin)}</div><div class="k" style="margin-top:8px">근거</div><div class="v ${get("s4.mineWhy")?"":"empty"}">${esc(get("s4.mineWhy")||"(미입력)")}</div></div>`;
}

/* =====================================================================
   이벤트
   ===================================================================== */
function bind(){
  main.querySelectorAll("textarea,input[type=text]").forEach(el=>{
    if(el.dataset.etc){ el.addEventListener("input",()=>{ const k=el.dataset.etc; const cur=get(k)||{}; if(Array.isArray(cur.values)) cur.etc=el.value; else cur.etc=el.value; set(k,cur); }); return; }
    if(el.dataset.type==="blank"){ el.addEventListener("input",()=>{ const k=el.dataset.key; const arr=Array.isArray(get(k))?get(k).slice():[]; arr[+el.dataset.idx]=el.value; set(k,arr); }); return; }
    if(el.dataset.key) el.addEventListener("input",()=>set(el.dataset.key,el.value));
  });
  main.querySelectorAll("input[type=radio]").forEach(el=>el.addEventListener("change",()=>{
    const k=el.dataset.key;
    if(el.dataset.type==="radio"){ const cur=get(k)||{}; cur.value=el.value; set(k,cur); }
    else set(k,el.value);
    el.closest(".opts")?.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o.querySelector("input").checked));
  }));
  main.querySelectorAll("input[type=checkbox]").forEach(el=>el.addEventListener("change",()=>{
    const k=el.dataset.key; const cur=get(k)||{values:[],etc:""}; const max=+el.dataset.max;
    if(el.checked){ if(max&&cur.values.length>=max){ el.checked=false; toast(`최대 ${max}개까지 선택할 수 있습니다.`); return; } cur.values.push(el.value); }
    else cur.values=cur.values.filter(x=>x!==el.value);
    set(k,cur); el.closest(".opt").classList.toggle("sel",el.checked);
  }));
  main.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{ S.clues[b.dataset.open]=true; save(); render(); const c=document.querySelector(`[data-clue="${b.dataset.open}"]`); c&&c.scrollIntoView({behavior:"smooth",block:"start"}); }));
  main.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{ S.current=+b.dataset.go; save(); render(); }));
  main.querySelectorAll("[data-submit]").forEach(b=>b.addEventListener("click",()=>submit(+b.dataset.submit)));
  const p2=document.getElementById("btnPrint2"); p2&&p2.addEventListener("click",doPrint);
}
function toast(t){ msg(t); setTimeout(()=>msg(""),2500); }

function submit(i){
  const st=STAGES[i];
  const missing=[], req=[];
  const walk=f=>{ if(!f||!f.key) return; const v=get(f.key); const empty=isEmpty(f,v); if(empty){ (f.required?req:missing).push(f.label||f.key); } };
  st.blocks.forEach(b=>{
    if(b.kind==="field") walk(b);
    if(b.kind==="pair"){ b.a.forEach(walk); b.b.forEach(walk); }
    if(b.kind==="clue"){ b.fields.forEach(walk); if(!S.clues[b.id]) req.push(b.title); }
    if(b.kind==="matrix"){ b.rows.forEach((r,ri)=>{ if(!get(b.key+"."+ri)) missing.push("스스로 확인하기 "+(ri+1)); }); }
  });
  if(i===0 && !(S.meta.cls&&S.meta.name)){ req.push("학번·이름 (왼쪽 입력란)"); }
  if(req.length){ alert("다음 항목은 꼭 입력해야 제출할 수 있습니다:\n\n- "+req.join("\n- ")); return; }
  const warn=missing.length?`아직 비어 있는 항목이 ${missing.length}개 있습니다:\n- ${missing.slice(0,6).join("\n- ")}${missing.length>6?"\n- …":""}\n\n`:"";
  if(!confirm(warn+"제출하면 이 단계의 답은 더 이상 고칠 수 없습니다. 제출할까요?")) return;
  const d=new Date(); S.stamps[st.id]=`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if(!S.locked.includes(i)) S.locked.push(i);
  if(i<STAGES.length-1) S.current=i+1;
  save(); render();
  if(i===STAGES.length-1) setTimeout(doPrint,300);
}
function isEmpty(f,v){
  if(v==null) return true;
  if(f.type==="radio") return !v.value || (v.value==="__etc__" && !(v.etc||"").trim());
  if(f.type==="check") return !v.values||!v.values.length;
  if(f.type==="blank") return !Array.isArray(v)||v.every(x=>!(x||"").trim());
  return !String(v).trim();
}

/* =====================================================================
   인쇄(PDF) 뷰
   ===================================================================== */
function ans(f){
  const v=get(f.key);
  if(f.type==="radio"){ if(!v||!v.value) return `<span class="empty">(미입력)</span>`; return v.value==="__etc__"?`다른 설명: ${esc(v.etc||"")}`:esc(v.value); }
  if(f.type==="check"){ if(!v||!v.values.length) return `<span class="empty">(미선택)</span>`; return v.values.map(x=>x==="__etc__"?`☑ 다른 조건: ${esc(v.etc||"")}`:`☑ ${esc(x)}`).join("<br>"); }
  if(f.type==="blank"){ const parts=f.tpl.split("___"); const cur=Array.isArray(v)?v:[]; let o=""; parts.forEach((p,pi)=>{ o+=esc(p).replace(/\n/g,"<br>"); if(pi<parts.length-1) o+=`<span class="blank${(cur[pi]||"").trim()?"":" empty"}">${esc((cur[pi]||"").trim()||"　　　　　　")}</span>`; }); return o; }
  return v&&String(v).trim()?esc(v):`<span class="empty">(미입력)</span>`;
}
function item(f, box=true){ const isBlank=f.type==="blank"; return `<div class="item"><div class="l">${f.no?esc(f.no)+" ":""}${esc(f.label||"")}</div><div class="v${(!box||isBlank)?" inline":""}">${ans(f)}</div></div>`; }
function buildPrint(){
  const pv=document.getElementById("printView");

  const r=k=>{ const v=get(k); return !v||!v.value?"—":(v.value==="__etc__"?(v.etc||"다른 설명"):v.value); };
  const c=k=>{ const v=get(k); return v&&v.values.length?v.values.map(x=>x==="__etc__"?(v.etc||"다른"):x).join(" / "):"—"; };
  const fld=(key)=>{ for(const st of STAGES) for(const b of st.blocks){ if(b.kind==="field"&&b.key===key) return b; if(b.kind==="pair"){ for(const f of [...b.a,...b.b]) if(f.key===key) return f; } if(b.kind==="clue"){ for(const f of b.fields) if(f.key===key) return f; } } return null; };
  const P=k=>item(fld(k));
  let h=`<div class="pv">
    <h1>1. 디지털 리터러시 — 내 피드는 내가 고른 걸까?</h1>

    <div class="summary"><h2>답변 요약</h2>
      <table><tr><th style="width:34%">처음 판단 (1단계)</th><td>${esc(r("s1.judge"))}</td></tr>
      <tr><th>근거로 판단 (4단계)</th><td>${esc(r("s4.mine"))}</td></tr>
      <tr><th>필요한 조건 (4단계 ③)</th><td>${esc(c("s4.cond"))}</td></tr>
      <tr><th>점검 항목 (5단계 ①)</th><td>${esc(c("s5.check"))}</td></tr>
      <tr><th>판단 변화 (6단계)</th><td>${esc(r("s6.change"))}</td></tr>
      <tr><th>오늘의 질문에 한 문장으로</th><td>${esc(get("s6.one")||"—")}</td></tr></table>
      <div style="font-size:9pt;color:#555">단서 확인: ${["c1","c2","c3"].map((x,i)=>`단서${i+1} ${S.clues[x]?"✓":"✗"}`).join(" · ")} · 제출 단계 ${S.locked.length}/6</div>
    </div>

    <h2>1. 주제 만나기 ${stamp("s1")}</h2>
    ${P("s1.clue")}${P("s1.judge")}${P("s1.judgeWhy")}${P("s1.need")}${P("s1.first")}

    <h2>2. 근거 탐구하기 ${stamp("s2")}</h2>
    ${P("s2.c1diff")}

    <table><tr><th style="width:50%">A</th><th>B</th></tr><tr>
      <td>① ${ans(fld("s2.aAct"))}<br>② ${ans(fld("s2.aSig"))}<br>③ ${ans(fld("s2.aRep"))}</td>
      <td>① ${ans(fld("s2.bAct"))}<br>② ${ans(fld("s2.bSig"))}<br>③ ${ans(fld("s2.bRep"))}</td></tr></table>

    ${P("s5.check")}${P("s5.user")}${P("s5.platform")}${P("s5.why")}

    <h2>6. 돌아보기 ${stamp("s6")}</h2>
    ${P("s6.change")}${P("s6.changeWhy")}${P("s6.more")}${P("s6.one")}
    <h3>스스로 확인하기</h3>
    <table><tr><th>확인할 내용</th><th style="width:22%">평가</th></tr>
    ${STAGES[5].blocks.find(b=>b.kind==="matrix").rows.map((rw,ri)=>`<tr><td>${esc(rw)}</td><td>${esc(get("s6.self."+ri)||"—")}</td></tr>`).join("")}</table>
  </div>`;
  pv.innerHTML=h;
}
function doPrint(){
  const empties=STAGES.length-S.locked.length;
  if(empties>0 && !confirm(`아직 제출하지 않은 단계가 ${empties}개 있습니다. 지금 상태로 PDF를 만들까요?`)) return;
  buildPrint();
  setTimeout(()=>window.print(),100);
}
window.addEventListener("beforeprint",buildPrint);

/* =====================================================================
   기타
   ===================================================================== */
document.getElementById("btnPrint").addEventListener("click",doPrint);
document.getElementById("btnReset").addEventListener("click",()=>{
  if(!confirm("모든 답과 진행 상태가 지워집니다. 처음부터 다시 할까요?")) return;
  if(!confirm("정말 지울까요? 되돌릴 수 없습니다.")) return;
  localStorage.removeItem(KEY); S=blank(); document.getElementById("cls").value=""; document.getElementById("nm").value=""; render(); msg("초기화됨");
});
["cls","nm"].forEach(id=>{ const el=document.getElementById(id); el.value=S.meta[id==="cls"?"cls":"name"]||""; el.addEventListener("input",()=>{ S.meta[id==="cls"?"cls":"name"]=el.value; save(); }); });

render();
</script>
