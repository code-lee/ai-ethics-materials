<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10. 생성형 AI — 첫 질문이 마지막 답을 정할까?</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#1c2230; --ink-2:#4b5563; --ink-3:#8a94a6;
  --paper:#ffffff; --bg:#f3f5f9; --line:#d9dee8; --line-2:#eceff4;
  --blue:#2457d6; --blue-soft:#e9effc; --blue-ink:#1a3f9e;
  --ok:#1f8f5f; --ok-soft:#e5f5ec; --warn:#b45309; --warn-soft:#fff4e5; --red:#c62828;
  --radius:10px;
  --font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
textarea,input,select{font-family:inherit;font-size:15px;color:var(--ink)}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.rail{background:var(--paper);border-right:1px solid var(--line);padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto}
.rail .unit{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.rail .title{font-size:17px;font-weight:700;line-height:1.35;margin:0 0 18px}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:8px;color:var(--ink-3);font-size:14px;cursor:default}
.steps li .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none;background:var(--paper)}
.steps li.done{color:var(--ink-2);cursor:pointer}
.steps li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.current{color:var(--blue-ink);background:var(--blue-soft);font-weight:600}
.steps li.current .n{border-color:var(--blue);color:var(--blue)}
.steps li.done:hover{background:var(--line-2)}
.rail .who{margin-top:22px;padding-top:16px;border-top:1px solid var(--line-2)}
.rail .who label{display:block;font-size:12px;color:var(--ink-3);margin:8px 0 3px}
.rail .who input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px}
.rail .tools{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.rail .save{font-size:12px;color:var(--ink-3);margin-top:10px;min-height:18px}

.main{padding:34px 40px 80px;max-width:820px;width:100%}
.stage{display:none}
.stage.active{display:block}
.stage h1{font-size:26px;line-height:1.3;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.stage h1 small{display:block;font-size:13px;color:var(--ink-3);font-weight:500;margin-bottom:6px;letter-spacing:0}
.stage .lead{color:var(--ink-2);margin:0 0 22px}
.stage h2{font-size:18px;margin:34px 0 10px;font-weight:700}
.stage h3{font-size:15.5px;margin:22px 0 8px;font-weight:700}
.stage p{margin:0 0 10px}
.stage .note{font-size:13px;color:var(--ink-3)}
.kq{border-left:4px solid var(--blue);background:var(--paper);padding:14px 18px;border-radius:0 var(--radius) var(--radius) 0;margin:10px 0 24px;font-weight:600;color:var(--blue-ink);line-height:1.55}
.kq .tag{display:block;font-size:12px;font-weight:600;color:var(--blue);margin-bottom:4px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:12px 0}
.box.tint{background:var(--blue-soft);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.concept{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:12px 0}
.concept b.t{display:block;font-size:16px;margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--paper);margin:8px 0 12px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
.tbl th{background:var(--line-2);font-weight:600;font-size:13px}

/* SNS 게시물 */
.post{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:12px 0}
.post .u{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.post .u .av{width:36px;height:36px;border-radius:50%;background:#dfe4ee}
.post .u b{display:block;font-size:14px}
.post .u span{font-size:12px;color:var(--ink-3)}
.post h3{margin:0 0 10px;font-size:20px;line-height:1.3}
.post p{margin:0 0 8px;font-size:15px}
.post .src{font-size:13px;color:var(--ink-3);border-top:1px solid var(--line-2);padding-top:8px;margin-top:10px}
.post .react{display:flex;gap:26px;font-size:13px;color:var(--ink-2);margin-top:8px}
.chat{display:flex;flex-direction:column;gap:6px;margin:10px 0 14px}
.chat span{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 14px 3px;padding:7px 13px;font-size:14px}

/* 검색 결과 */
.serp{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:10px 0 14px}
.serp .bar{background:var(--line-2);padding:10px 14px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.serp .bar span{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:5px 14px;flex:1}
.serp .r{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line-2)}
.serp .r .n{color:var(--ink-3);font-size:13px;padding-top:2px}
.serp .r .site{font-size:12.5px;color:var(--ink-3)}
.serp .r .t{color:var(--blue);font-weight:600;font-size:15px}
.serp .r .d{font-size:13.5px;color:var(--ink-2)}
.serp .r .cite{display:inline-block;margin-top:5px;font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 8px;color:var(--ink-2)}
.serp .r .cite b{font-weight:600;color:var(--ink-3);margin-right:4px}
.serp .r.doc .t{color:#5b3fb5}

/* 리빌/단서 */
.clue{border:1.5px solid var(--line);border-radius:var(--radius);margin:14px 0;background:var(--paper);overflow:hidden}
.clue .ch{display:flex;align-items:center;gap:12px;padding:14px 18px}
.clue .ch b{font-size:15.5px}
.clue .ch .st{font-size:12.5px;color:var(--ink-3)}
.clue .ch button{margin-left:auto}
.clue .cb{display:none;padding:0 18px 18px;border-top:1px solid var(--line-2)}
.clue.open .cb{display:block}
.clue.open{border-color:var(--blue)}
.clue.open .ch .st{color:var(--ok)}
.reveal{display:flex;gap:14px;align-items:center;background:var(--blue-soft);border-radius:var(--radius);padding:14px 18px;margin:18px 0}
.reveal .rt{flex:1;font-size:14.5px;color:var(--blue-ink)}
.echo{background:var(--line-2);border-radius:8px;padding:10px 14px;margin:8px 0 12px;font-size:14px}
.echo div{display:flex;gap:10px}
.echo b{flex:none;color:var(--blue)}
.echo .empty{color:var(--ink-3)}

/* 질문 */
.q{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:14px 0}
.q .ql{font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.q .ql .no{color:var(--blue);flex:none}
.q .qh{font-size:13.5px;color:var(--ink-2);margin:-4px 0 10px}
.q textarea{width:100%;min-height:78px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;resize:vertical;line-height:1.55;background:#fbfcfe}
.q input[type=text]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fbfcfe}
.q select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fbfcfe;min-width:160px}
.q textarea:focus,.q input:focus,.q select:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.row{flex-direction:row;flex-wrap:wrap;gap:8px 16px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.opt:hover{background:var(--line-2)}
.opt input{margin-top:4px;accent-color:var(--blue)}
.opt.sel{background:var(--blue-soft);border-color:#c7d5f7}
.opt .etc{flex:1;padding:4px 8px;border:0;border-bottom:1px solid var(--line);background:transparent}
.blank{line-height:2.3}
.blank input{width:min(100%,340px);padding:4px 8px;border:0;border-bottom:1.5px solid var(--ink-3);background:transparent;border-radius:0;margin:0 4px}
.blank input:focus{outline:0;border-bottom-color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .lab{font-size:13px;font-weight:600;margin-bottom:4px;color:var(--ink-2)}
.mtx{width:100%;border-collapse:collapse;font-size:14px}
.mtx th,.mtx td{border:1px solid var(--line);padding:9px 10px;text-align:center}
.mtx td:first-child,.mtx th:first-child{text-align:left}
.mtx input{accent-color:var(--blue)}
.mtx th{background:var(--line-2);font-weight:600;font-size:13px}
.rows3 .row{display:grid;grid-template-columns:minmax(40px,170px) 1fr;gap:10px;align-items:start;margin-bottom:10px}
.rows3 .row .lb{font-weight:600;color:var(--blue);padding-top:8px}
.claimgrid{display:grid;grid-template-columns:80px 1fr 1fr 150px;gap:8px;align-items:start}
.claimgrid .hd{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.claimgrid .lb{font-weight:600;color:var(--blue);padding-top:8px}
.claimgrid textarea{min-height:64px}
.claimgrid .opts{gap:2px}
.claimgrid .opt{padding:4px 6px;font-size:13.5px}
.judge{display:grid;grid-template-columns:80px 190px 1fr;gap:8px;align-items:start;margin-bottom:8px}
.judge .lb{font-weight:600;color:var(--blue);padding-top:8px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare .col{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.compare .col .k{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.compare .col .v{font-weight:600}
.compare .col .v.empty{color:var(--ink-3);font-weight:400}

.stage.locked textarea,.stage.locked input,.stage.locked select{background:#f5f7fa;color:var(--ink-2)}
.stage.locked .opt{cursor:default}
.lockbar{display:flex;gap:10px;align-items:center;background:var(--ok-soft);color:#125c3c;border-radius:8px;padding:9px 14px;font-size:13.5px;margin:0 0 18px}
.lockbar::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}

.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{background:var(--line-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{border-color:transparent;color:var(--ink-3)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.nav .hint{font-size:13px;color:var(--ink-3)}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px}
  .rail .steps{display:flex;gap:4px;overflow:auto;padding-bottom:4px}
  .rail .steps li{flex:none;padding:6px 10px;font-size:13px}
  .rail .steps li .lbl{display:none}
  .rail .steps li.current .lbl{display:inline}
  .rail .who{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:0;margin-top:10px;padding-top:0}
  .rail .tools{flex-direction:row;flex-wrap:wrap;margin-top:12px}
  .main{padding:22px 16px 60px}
  .two,.grid2,.compare{grid-template-columns:1fr}
  .claimgrid{grid-template-columns:1fr}
  .judge{grid-template-columns:1fr}
  .stage h1{font-size:22px}
}

/* 장면 카드 */
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.scene{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.scene .sh{background:var(--line-2);padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.scene .sb{padding:12px 14px;font-size:14px}
.scene .bubble{display:inline-block;background:var(--blue-soft);color:var(--blue-ink);border-radius:12px 12px 12px 3px;padding:6px 11px;margin:4px 0;font-size:13.5px}
.scene .bubble.me{background:#e5f5ec;color:#125c3c;border-radius:12px 12px 3px 12px}
.scene .snsq{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}
.scene .snsq b{display:block;font-size:13.5px}
.scene .snsq .r{color:var(--ink-3);font-size:12px;margin-top:4px}
.quotes{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 18px;margin:10px 0}
.quotes p{margin:4px 0;font-size:14.5px}
.quotes p::before{content:"“ ";color:var(--ink-3)}
.vs{display:grid;grid-template-columns:1fr 40px 1fr;gap:8px;align-items:center;margin:12px 0}
.vs .fr{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vs .fr .fh{padding:8px 12px;font-size:12.5px;font-weight:600;background:var(--line-2)}
.vs .fr .fb{padding:14px;font-size:14px;min-height:96px}
.vs .fr.after .fh{background:#fdeaf1;color:#b81f56}
.vs .mid{text-align:center;font-size:11px;color:var(--ink-3);font-weight:600}
.spread{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.spread .sp{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.spread .sp b{display:block;font-size:13px;margin-bottom:3px}
.spectrum{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0 4px}
.spectrum .sg{padding:10px 8px;border-radius:8px;font-size:12.5px;text-align:center;font-weight:600;line-height:1.35}
.spectrum .sg.k{background:var(--blue-soft);color:var(--blue-ink)}
.spectrum .sg.m{background:#fdeaf1;color:#b81f56}
.spectrum-lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
.spectrum-lab span:last-child{color:#b81f56;font-weight:600}
.persp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.persp .pc{border-radius:12px;padding:14px 16px;border:1.5px solid}
.persp .pc.v{border-color:#e0457b;background:#fff7fa}
.persp .pc.m{border-color:#2f6fed;background:#f5f8ff}
.persp .pc b.t{display:block;font-size:15px;margin-bottom:8px}
.persp .pc ol{margin:0 0 8px;padding-left:20px;font-size:14px}
.persp .pc li{margin-bottom:4px}
.persp .pc .qt{font-size:14px;font-style:italic;color:var(--ink-2)}
@media (max-width:820px){.scenes,.spread,.persp{grid-template-columns:1fr}.vs{grid-template-columns:1fr}.vs .mid{display:none}.spectrum{grid-template-columns:repeat(3,1fr)}}

/* 제출물 카드 */
.subs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.sub{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.sub.a{border-color:#2f6fed}.sub.b{border-color:#1f8f5f}.sub.c{border-color:#7c3aed}
.sub .sh{font-weight:700;font-size:15px;margin-bottom:8px}
.sub.a .sh{color:#2f6fed}.sub.b .sh{color:#1f8f5f}.sub.c .sh{color:#7c3aed}
.sub .kv{font-size:13.5px;margin-bottom:4px}.sub .kv b{color:var(--ink-2);font-weight:600}
.sub .qt{font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--line);padding-left:10px;margin:8px 0}
.sub .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sub .tags span{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--line-2);color:var(--ink-2)}
.proc{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;margin:10px 0}
.proc th{padding:8px;text-align:center;font-size:15px;border-radius:8px 8px 0 0}
.proc th.a{background:#e8f0ff;color:#2f6fed}.proc th.b{background:#e5f5ec;color:#1f8f5f}.proc th.c{background:#efe6ff;color:#7c3aed}
.proc td{background:var(--paper);border:1px solid var(--line);padding:9px 11px;vertical-align:top}
.proc td .st{display:block;font-weight:700;font-size:12.5px;color:var(--ink-3);margin-bottom:2px}
.proc td.warn{background:#fff9f0}
.gridq{width:100%;border-collapse:collapse;font-size:13.5px}
.gridq th,.gridq td{border:1px solid var(--line);padding:8px 8px;vertical-align:top}
.gridq th{background:var(--line-2);font-weight:600;font-size:13px;text-align:center}
.gridq td:first-child{font-weight:600;width:24%;background:#fbfcfe}
.gridq .opt{padding:3px 4px;font-size:13px}
.gridq .opts{gap:1px}
.task{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.task .tk{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.task .tk b.t{display:block;font-size:15px;margin-bottom:6px}
.task .tk ul{margin:0 0 8px;padding-left:18px;font-size:14px}
.task .tk .core{font-size:13.5px;font-weight:600;color:var(--blue-ink);background:var(--blue-soft);padding:6px 10px;border-radius:6px}
.rubric{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:20px 24px;margin:12px 0}
.rubric h3.rt{text-align:center;font-size:20px;margin:0 0 16px}
.rubric .q{margin:10px 0}
@media (max-width:820px){.subs,.task{grid-template-columns:1fr}.proc{display:block;overflow-x:auto}.gridq{display:block;overflow-x:auto}}

/* 팀 카드·대화 */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.team{border-radius:12px;padding:14px 16px;border:1.5px solid}
.team.a{border-color:#2f6fed;background:#f5f8ff}.team.b{border-color:#e8862a;background:#fff8f0}
.team .th{font-weight:700;font-size:15px;margin-bottom:2px}
.team.a .th{color:#2f6fed}.team.b .th{color:#c96a12}
.team .sub{font-size:13px;color:var(--ink-2);margin-bottom:8px}
.team ul{margin:0 0 8px;padding-left:18px;font-size:14px}
.team .slogan{font-size:13.5px;font-weight:600;padding:5px 10px;border-radius:6px;display:inline-block}
.team.a .slogan{background:#e8f0ff;color:#1a3f9e}.team.b .slogan{background:#fdebd6;color:#9a4b00}
.same{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.same .s{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px}
.same .s b{display:block;font-size:13.5px;margin-bottom:2px}
.dlg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.dlg .d{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dlg .d .no{font-size:12.5px;font-weight:700;margin-bottom:8px}
.dlg .d.a .no{color:#2f6fed}.dlg .d.b .no{color:#c96a12}
.dlg .d .no em{font-style:normal;font-weight:500;color:var(--ink-3);margin-left:6px}
.msg{display:flex;gap:8px;margin-bottom:8px;font-size:14px}
.msg .who{flex:none;width:44px;font-size:12px;color:var(--ink-3);padding-top:5px}
.msg .bb{border-radius:10px;padding:7px 11px;line-height:1.5}
.msg.h .bb{background:var(--line-2)}
.msg.ai .bb{background:var(--blue-soft);color:var(--blue-ink)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.flow .f{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;text-align:center}
.flow .f b{display:block;font-size:13px}
.flow .f small{color:var(--ink-3)}
.flow .ar{color:var(--ink-3)}
.flow .f.end{background:var(--blue-soft);border-color:transparent;color:var(--blue-ink)}

/* =====================================================================
   엔진 — 상태
   ===================================================================== */
const KEY=MODULE.key;
let S=load();
function blank(){ return {answers:{},current:0,locked:[],clues:{},stamps:{},meta:{}}; }
function load(){ try{ const j=JSON.parse(localStorage.getItem(KEY)); if(j&&j.answers) return Object.assign(blank(),j);}catch(e){} return blank(); }
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); const d=new Date(); msg(`자동 저장됨 ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`);}catch(e){ msg("저장 실패: 브라우저 저장 공간을 확인하세요."); } },250); }
function msg(t){ document.getElementById("saveMsg").textContent=t; }
const pad=n=>String(n).padStart(2,"0");
const get=k=>S.answers[k];
const set=(k,v)=>{ S.answers[k]=v; save(); };
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

/* 필드 색인 (인쇄·검증용) */
const FIELDS={};
function collectFields(){
  STAGES.forEach(st=>st.blocks.forEach(b=>{
    const add=f=>{ if(f&&f.key) FIELDS[f.key]=f; };
    if(b.kind==="field") add(b);
    if(b.kind==="pair"){ b.a.forEach(add); b.b.forEach(add); }
    if(b.kind==="clue") b.fields.forEach(add);
    if(b.kind==="rows") b.rows.forEach(r=>add({key:r[1],label:r[0],type:r[2]||"line"}));
    if(b.kind==="claims") b.rows.forEach(r=>{ add({key:r.ok,label:r.lb+" 자료로 확인할 수 있는 것",type:"text"}); add({key:r.not,label:r.lb+" 아직 확정해서 말하기 어려운 것",type:"text"}); add({key:r.src,label:r.lb+" 근거 자료",type:"check",options:r.srcOpts}); });
    if(b.kind==="grid") b.rows.forEach(r=>r.keys.forEach((k,ci)=>add({key:k,label:`${r.label} (${b.cols[ci]})`,type:"radio",options:r.options})));
    if(b.kind==="judge") b.rows.forEach(r=>{ add({key:r[1],label:r[0]+" 판단",type:"select",options:JUDGE}); add({key:r[2],label:r[0]+" 가장 중요한 근거",type:"text"}); });
  }));
}
collectFields();

/* =====================================================================
   렌더링
   ===================================================================== */
const main=document.getElementById("main");
function isOpen(gate){ return !gate || !!S.clues[gate]; }
function render(){
  main.innerHTML="";
  STAGES.forEach((st,i)=>{
    const sec=document.createElement("section");
    sec.className="stage"+(i===S.current?" active":"")+(S.locked.includes(i)?" locked":"");
    sec.dataset.i=i;
    let h=`<h1><small>${esc(st.sub||"")}</small>${esc(st.title)}</h1>`;
    if(S.locked.includes(i)) h+=`<div class="lockbar">이 단계는 ${esc(S.stamps[st.id]||"")}에 제출되어 잠겼습니다. 답은 읽기만 할 수 있습니다.</div>`;
    if(st.lead) h+=`<p class="lead">${esc(st.lead)}</p>`;
    h+=st.blocks.map(b=>{ if(!isOpen(b.gate)) return ""; return renderBlock(b,st,i); }).join("");
    h+=renderNav(i);
    sec.innerHTML=h;
    main.appendChild(sec);
  });
  bind(); renderSteps(); lockInputs();
  if(MODULE.compare&&STAGES[S.current].blocks.some(b=>b.kind==="compare")) renderCompare();
  window.scrollTo({top:0});
}
function renderBlock(b){
  switch(b.kind){
    case "kq": return `<div class="kq"><span class="tag">핵심 질문</span>${esc(MODULE.keyQuestion)}</div>`;
    case "h2": return `<h2>${esc(b.text)}</h2>`;
    case "h3": return `<h3>${esc(b.text)}</h3>`;
    case "html": return `<div>${b.html}</div>`;
    case "field": return `<div class="q">${fieldHead(b)}${fieldInput(b)}</div>`;
    case "pair": return `<div class="q">${b.title?`<div class="ql">${esc(b.title)}</div>`:""}<div class="grid2">
        <div><div class="lab">${esc(b.la||"A")}</div>${b.a.map(f=>`<div style="margin-bottom:10px">${f.label?`<div class="qh">${esc(f.label)}</div>`:""}${fieldInput(f)}</div>`).join("")}</div>
        <div><div class="lab">${esc(b.lb||"B")}</div>${b.b.map(f=>`<div style="margin-bottom:10px">${f.label?`<div class="qh">${esc(f.label)}</div>`:""}${fieldInput(f)}</div>`).join("")}</div></div></div>`;
    case "rows": return `<div class="q rows3">${b.title?`<div class="ql">${esc(b.title)}</div>`:""}${b.rows.map(r=>`<div class="row"><div class="lb">${esc(r[0])}</div>${fieldInput({key:r[1],type:r[2]||"line",rows:2})}</div>`).join("")}</div>`;
    case "trail": return `<div class="q"><div class="ql">${esc(b.title)}</div><table class="mtx"><tr>${b.items.map(it=>`<th>${esc(it[0])}</th>`).join("")}</tr><tr>${b.items.map(it=>{const v=get(it[1]);const t=v&&v.value?v.value.split(" — ")[0]:(typeof v==="string"&&v?v:"—");return `<td style="text-align:center;font-weight:600">${esc(t)}</td>`;}).join("")}</tr></table></div>`;
    case "echo": return `<div class="echo">${b.items.map(it=>{ const v=plain(it[1]); const has=v!=="—"; return `<div>${it[0]?`<b>${esc(it[0])}</b>`:"<b style='visibility:hidden'>·</b>"}<span class="${has?"":"empty"}">${esc(has?v:"(아직 입력하지 않음)")}</span></div>`; }).join("")}</div>`;
    case "reveal": {
      if(S.clues[b.id]) return "";
      const ready=b.need.every(k=>!isEmpty(FIELDS[k]||{type:"line"},get(k)));
      return `<div class="reveal"><div class="rt">${esc(b.text)}${ready?"":"<br><span class='note'>위 항목을 먼저 입력하세요.</span>"}</div><button class="btn primary" data-reveal="${b.id}" ${ready?"":"disabled"}>${esc(b.btn)}</button></div>`;
    }
    case "clue": {
      const open=!!S.clues[b.id];
      return `<div class="clue${open?" open":""}" data-clue="${b.id}"><div class="ch"><b>${esc(b.title)}</b><span class="st">${open?"확인함":"아직 열지 않음"}</span>${open?"":`<button class="btn sm primary" data-reveal="${b.id}">열기</button>`}</div>
        <div class="cb">${b.html}${b.fields.map(f=>`<div class="q" style="margin-bottom:0">${fieldHead(f)}${fieldInput(f)}</div>`).join("")}</div></div>`;
    }
    case "claims": return `<div class="q"><div class="claimgrid"><div></div><div class="hd">자료로 확인할 수 있는 것</div><div class="hd">아직 확정해서 말하기 어려운 것</div><div class="hd">근거 자료</div>
      ${b.rows.map(r=>`<div class="lb">${esc(r.lb)}</div><div>${fieldInput({key:r.ok,type:"text",rows:3})}</div><div>${fieldInput({key:r.not,type:"text",rows:3})}</div><div>${fieldInput({key:r.src,type:"check",options:r.srcOpts})}</div>`).join("")}</div></div>`;
    case "grid": return `<div class="q" style="padding:10px"><table class="gridq"><tr><th>확인할 점</th>${b.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${b.rows.map(r=>`<tr><td>${esc(r.label)}</td>${r.keys.map(k=>`<td>${fieldInput({key:k,type:"radio",options:r.options})}</td>`).join("")}</tr>`).join("")}</table></div>`;
    case "judge": return `<div class="q"><div class="judge"><div></div><div class="hd" style="font-size:12.5px;font-weight:600;color:var(--ink-2)">개념 적용 후 판단</div><div class="hd" style="font-size:12.5px;font-weight:600;color:var(--ink-2)">가장 중요한 근거</div>
      ${b.rows.map(r=>`<div class="lb">${esc(r[0])}</div><div>${fieldInput({key:r[1],type:"select",options:JUDGE})}</div><div>${fieldInput({key:r[2],type:"text",rows:2})}</div>`).join("")}</div></div>`;
    case "matrix": return `<div class="q"><table class="mtx"><thead><tr><th>확인할 내용</th>${b.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>
      ${b.rows.map((r,ri)=>`<tr><td>${esc(r)}</td>${b.cols.map(c=>`<td><input type="radio" name="${b.key}.${ri}" data-key="${b.key}.${ri}" value="${esc(c)}" ${get(b.key+"."+ri)===c?"checked":""}></td>`).join("")}</tr>`).join("")}
      </tbody></table></div>`;
    case "compare": return `<div class="q"><div class="ql">처음 판단과 지금 판단</div><div class="compare" id="cmp"></div></div>`;
  }
  return "";
}
function fieldHead(b){ return `${b.label?`<div class="ql">${b.no?`<span class="no">${esc(b.no)}</span>`:""}<span>${esc(b.label)}</span></div>`:""}${b.help?`<div class="qh">${esc(b.help)}</div>`:""}`; }
function fieldInput(b){
  const v=get(b.key);
  switch(b.type){
    case "text": return `<textarea data-key="${b.key}" rows="${b.rows||3}" placeholder="${esc(b.placeholder||"")}">${esc(v||"")}</textarea>`;
    case "line": return `<input type="text" data-key="${b.key}" value="${esc(v||"")}" placeholder="${esc(b.placeholder||"")}">`;
    case "select": return `<select data-key="${b.key}" data-type="select"><option value="">선택</option>${b.options.map((o,i)=>`<option value="${esc(o)}" ${v===o?"selected":""}>${i+1}. ${esc(o)}</option>`).join("")}</select>`;
    case "radio": { const cur=v||{};
      return `<div class="opts${b.inline?" row":""}">${b.options.map(o=>{ const isEtc=typeof o==="object"; const val=isEtc?"__etc__":o; const sel=cur.value===val;
        return `<label class="opt${sel?" sel":""}"><input type="radio" name="${b.key}" data-key="${b.key}" data-type="radio" value="${esc(val)}" ${sel?"checked":""}>${isEtc?`<span style="flex:none">${esc(o.etc)}:</span><input class="etc" type="text" data-etc="${b.key}" value="${esc(cur.etc||"")}" placeholder="직접 쓰기">`:`<span>${esc(o)}</span>`}</label>`;}).join("")}</div>`; }
    case "check": { const cur=v||{values:[],etc:""};
      return `<div class="opts">${b.options.map(o=>{ const isEtc=typeof o==="object"; const val=isEtc?"__etc__":o; const sel=cur.values.includes(val);
        return `<label class="opt${sel?" sel":""}"><input type="checkbox" data-key="${b.key}" data-type="check" data-max="${b.max||0}" value="${esc(val)}" ${sel?"checked":""}>${isEtc?`<span style="flex:none">${esc(o.etc)}:</span><input class="etc" type="text" data-etc="${b.key}" value="${esc(cur.etc||"")}" placeholder="직접 쓰기">`:`<span>${esc(o)}</span>`}</label>`;}).join("")}</div>`; }
    case "blank": { const parts=b.tpl.split("___"); const cur=Array.isArray(v)?v:[]; let out=`<div class="blank">`;
      parts.forEach((p,pi)=>{ out+=esc(p).replace(/\n/g,"<br>"); if(pi<parts.length-1) out+=`<input type="text" data-key="${b.key}" data-type="blank" data-idx="${pi}" value="${esc(cur[pi]||"")}">`; });
      return out+"</div>"; }
  }
  return "";
}
function renderNav(i){
  const last=i===STAGES.length-1, locked=S.locked.includes(i);
  return `<div class="nav"><div>${i>0?`<button class="btn" data-go="${i-1}">이전 단계 보기</button>`:""}</div>
    <div class="hint">${locked?"":"제출하면 이 단계의 답은 고정됩니다."}</div>
    <div>${locked?(last?`<button class="btn primary" data-print="1">PDF로 저장</button>`:`<button class="btn primary" data-go="${i+1}">다음 단계 보기</button>`):
      (last?`<button class="btn primary" data-submit="${i}">제출하고 PDF 만들기</button>`:`<button class="btn primary" data-submit="${i}">제출하고 다음 단계로</button>`)}</div></div>`;
}
function renderSteps(){
  const ul=document.getElementById("steps"); ul.innerHTML="";
  STAGES.forEach((st,i)=>{ const li=document.createElement("li"); const done=S.locked.includes(i);
    li.className=(done?"done":"")+(i===S.current?" current":"");
    li.innerHTML=`<span class="n">${done?"✓":i+1}</span><span class="lbl">${esc(st.short)}</span>`;
    li.addEventListener("click",()=>{ if(done||i===S.current){S.current=i;save();render();} });
    ul.appendChild(li); });
}
function lockInputs(){ document.querySelectorAll(".stage.locked").forEach(sec=>sec.querySelectorAll("textarea,input,select,button[data-reveal]").forEach(el=>{ if(!el.closest(".nav")) el.disabled=true; })); }
function renderCompare(){
  const el=document.getElementById("cmp"); if(!el) return; const c=MODULE.compare;
  const txt=r=>{ if(!r||!r.value) return `<span class="empty">(미입력)</span>`; return r.value==="__etc__"?esc(r.etc||"(다른 설명)"):esc(r.value); };
  el.innerHTML=`<div class="col"><div class="k">${esc(c.firstLabel)} (${esc(S.stamps[c.firstStage]||"")})</div><div class="v">${txt(get(c.firstKey))}</div><div class="k" style="margin-top:8px">이유</div><div class="v ${get(c.firstWhy)?"":"empty"}">${esc(get(c.firstWhy)||"(미입력)")}</div></div>
  <div class="col"><div class="k">${esc(c.lastLabel)} (${esc(S.stamps[c.lastStage]||"")})</div><div class="v">${txt(get(c.lastKey))}</div><div class="k" style="margin-top:8px">이유</div><div class="v ${get(c.lastWhy)?"":"empty"}">${esc(get(c.lastWhy)||"(미입력)")}</div></div>`;
}

/* =====================================================================
   이벤트
   ===================================================================== */
function bind(){
  main.querySelectorAll("textarea,input[type=text]").forEach(el=>{
    if(el.dataset.etc){ el.addEventListener("input",()=>{ const k=el.dataset.etc; const cur=get(k)||{}; cur.etc=el.value; set(k,cur); }); return; }
    if(el.dataset.type==="blank"){ el.addEventListener("input",()=>{ const k=el.dataset.key; const arr=Array.isArray(get(k))?get(k).slice():[]; arr[+el.dataset.idx]=el.value; set(k,arr); refreshReveals(); }); return; }
    if(el.dataset.key) el.addEventListener("input",()=>{ set(el.dataset.key,el.value); refreshReveals(); });
  });
  main.querySelectorAll("select[data-key]").forEach(el=>el.addEventListener("change",()=>{ set(el.dataset.key,el.value); refreshReveals(); }));
  main.querySelectorAll("input[type=radio]").forEach(el=>el.addEventListener("change",()=>{
    const k=el.dataset.key; if(el.dataset.type==="radio"){ const cur=get(k)||{}; cur.value=el.value; set(k,cur); } else set(k,el.value);
    el.closest(".opts")?.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o.querySelector("input").checked));
    refreshReveals();
  }));
  main.querySelectorAll("input[type=checkbox]").forEach(el=>el.addEventListener("change",()=>{
    const k=el.dataset.key; const cur=get(k)||{values:[],etc:""}; const max=+el.dataset.max;
    if(el.checked){ if(max&&cur.values.length>=max){ el.checked=false; toast(`최대 ${max}개까지 선택할 수 있습니다.`); return; } cur.values.push(el.value); }
    else cur.values=cur.values.filter(x=>x!==el.value);
    set(k,cur); el.closest(".opt").classList.toggle("sel",el.checked);
  }));
  main.querySelectorAll("[data-reveal]").forEach(b=>b.addEventListener("click",()=>{ S.clues[b.dataset.reveal]=true; save(); const y=window.scrollY; render(); window.scrollTo({top:y}); }));
  main.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{ S.current=+b.dataset.go; save(); render(); }));
  main.querySelectorAll("[data-submit]").forEach(b=>b.addEventListener("click",()=>submit(+b.dataset.submit)));
  main.querySelectorAll("[data-print]").forEach(b=>b.addEventListener("click",doPrint));
}
/* 입력에 따라 리빌 버튼 활성화만 갱신 (전체 재렌더 없이) */
function refreshReveals(){
  document.querySelectorAll("[data-reveal]").forEach(btn=>{
    const st=STAGES[S.current]; const b=st.blocks.find(x=>x.kind==="reveal"&&x.id===btn.dataset.reveal); if(!b) return;
    const ready=b.need.every(k=>!isEmpty(FIELDS[k]||{type:"line"},get(k)));
    btn.disabled=!ready; const note=btn.parentElement.querySelector(".note"); if(note) note.style.display=ready?"none":"";
  });
}
function toast(t){ msg(t); setTimeout(()=>msg(""),2500); }
function submit(i){
  const st=STAGES[i]; const missing=[], req=[];
  const walk=f=>{ if(!f||!f.key) return; if(isEmpty(f,get(f.key))) (f.required?req:missing).push(f.label||f.key); };
  st.blocks.forEach(b=>{
    if(b.kind==="field") walk(b);
    if(b.kind==="pair"){ b.a.forEach(f=>walk(Object.assign({label:b.la},f))); b.b.forEach(f=>walk(Object.assign({label:b.lb},f))); }
    if(b.kind==="clue"){ b.fields.forEach(walk); if(!S.clues[b.id]) req.push(b.title); }
    if(b.kind==="reveal"&&!S.clues[b.id]) req.push(`“${b.btn}” 열기`);
    if(b.kind==="rows") b.rows.forEach(r=>walk(FIELDS[r[1]]));
    if(b.kind==="claims") b.rows.forEach(r=>[r.ok,r.not,r.src].forEach(k=>walk(FIELDS[k])));
    if(b.kind==="judge") b.rows.forEach(r=>{ walk(Object.assign({required:true},FIELDS[r[1]])); walk(FIELDS[r[2]]); });
    if(b.kind==="grid") b.rows.forEach(r=>r.keys.forEach(k=>walk(FIELDS[k])));
    if(b.kind==="matrix") b.rows.forEach((r,ri)=>{ if(!get(b.key+"."+ri)) missing.push("스스로 확인하기 "+(ri+1)); });
  });
  if(i===0&&!(S.meta.cls&&S.meta.name)) req.push("학번·이름 (왼쪽 입력란)");
  if(req.length){ alert("다음 항목은 꼭 입력해야 제출할 수 있습니다:\n\n- "+req.join("\n- ")); return; }
  const warn=missing.length?`아직 비어 있는 항목이 ${missing.length}개 있습니다:\n- ${missing.slice(0,6).join("\n- ")}${missing.length>6?"\n- …":""}\n\n`:"";
  if(!confirm(warn+"제출하면 이 단계의 답은 더 이상 고칠 수 없습니다. 제출할까요?")) return;
  const d=new Date(); S.stamps[st.id]=`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if(!S.locked.includes(i)) S.locked.push(i);
  if(i<STAGES.length-1) S.current=i+1;
  save(); render();
  if(i===STAGES.length-1) setTimeout(doPrint,300);
}
function isEmpty(f,v){
  if(v==null) return true;
  if(f.type==="radio") return !v.value||(v.value==="__etc__"&&!(v.etc||"").trim());
  if(f.type==="check") return !v.values||!v.values.length;
  if(f.type==="blank") return !Array.isArray(v)||v.every(x=>!(x||"").trim());
  return !String(v).trim();
}

/* =====================================================================
   인쇄(PDF) 뷰 — STAGES 정의에서 자동 생성
   ===================================================================== */
function ans(f){
  const v=get(f.key);
  if(f.type==="radio"){ if(!v||!v.value) return `<span class="empty">(미입력)</span>`; return v.value==="__etc__"?`다른: ${esc(v.etc||"")}`:esc(v.value); }
  if(f.type==="check"){ if(!v||!v.values.length) return `<span class="empty">(미선택)</span>`; return v.values.map(x=>x==="__etc__"?`☑ 다른: ${esc(v.etc||"")}`:`☑ ${esc(x)}`).join("<br>"); }
  if(f.type==="blank"){ const parts=f.tpl.split("___"); const cur=Array.isArray(v)?v:[]; let o=""; parts.forEach((p,pi)=>{ o+=esc(p).replace(/\n/g,"<br>"); if(pi<parts.length-1) o+=`<span class="blank${(cur[pi]||"").trim()?"":" empty"}">${esc((cur[pi]||"").trim()||"　　　　　　")}</span>`; }); return o; }
  return v&&String(v).trim()?esc(v):`<span class="empty">(미입력)</span>`;
}
function item(f){ return `<div class="item">${f.label?`<div class="l">${f.no?esc(f.no)+" ":""}${esc(f.label)}</div>`:""}<div class="v${f.type==="blank"?" inline":""}">${ans(f)}</div></div>`; }
function plain(k){ const f=FIELDS[k]; const v=get(k); if(!f||v==null) return "—";
  if(f.type==="radio") return v.value?(v.value==="__etc__"?(v.etc||"다른"):v.value):"—";
  if(f.type==="check") return v.values&&v.values.length?v.values.map(x=>x==="__etc__"?(v.etc||"다른"):x).join(" / "):"—";
  if(f.type==="blank") return Array.isArray(v)?v.filter(x=>x&&x.trim()).join(" / ")||"—":"—";
  return String(v).trim()||"—"; }
function buildPrint(){
  const pv=document.getElementById("printView");
  const stamp=id=>S.stamps[id]?`<span class="stamp">제출 ${esc(S.stamps[id])}</span>`:`<span class="stamp">(미제출)</span>`;
  let h=`<div class="pv"><h1>${esc(MODULE.printTitle)}</h1>
    <div class="meta"><span>고등학교 AI 윤리 교육 · 학생 활동지</span><span>${esc(S.meta.cls||"")} ${esc(S.meta.name||"")}</span></div>
    <div class="kq">핵심 질문 — ${esc(MODULE.keyQuestion)}</div>
    <div class="summary"><h2>답변 요약</h2><table>${MODULE.summary.map(([l,k])=>`<tr><th style="width:36%">${esc(l)}</th><td>${Array.isArray(k)?k.map((kk)=>esc(plain(kk).split(" — ")[0])).join(" / "):esc(plain(k))}</td></tr>`).join("")}</table>
      <div style="font-size:9pt;color:#555">제출 단계 ${S.locked.length}/${STAGES.length}</div></div>`;
  STAGES.forEach((st,si)=>{
    h+=`<h2${si===3?" class='pb'":""}>${esc(st.title)}${st.sub?" — "+esc(st.sub):""} ${stamp(st.id)}</h2>`;
    st.blocks.forEach(b=>{
      switch(b.kind){
        case "h2": if(/^[①-⑩0-9]/.test(b.text)||/확인하기|적용|원칙|단계/.test(b.text)) h+=`<h3>${esc(b.text)}</h3>`; break;
        case "field": h+=item(b); break;
        case "rows": h+=`<table>${b.rows.map(r=>`<tr><th style="width:18%">${esc(r[0])}</th><td>${ans(FIELDS[r[1]])}</td></tr>`).join("")}</table>`; break;
        case "pair": h+=`<table><tr><th style="width:50%">${esc(b.la||"A")}</th><th>${esc(b.lb||"B")}</th></tr><tr><td>${b.a.map(f=>`${f.label?"<b>"+esc(f.label)+"</b><br>":""}${ans(f)}`).join("<br>")}</td><td>${b.b.map(f=>`${f.label?"<b>"+esc(f.label)+"</b><br>":""}${ans(f)}`).join("<br>")}</td></tr></table>`; break;
        case "clue": b.fields.forEach(f=>h+=item(f)); break;
        case "claims": h+=`<table><tr><th style="width:12%"></th><th>자료로 확인할 수 있는 것</th><th>아직 확정해서 말하기 어려운 것</th><th style="width:16%">근거 자료</th></tr>${b.rows.map(r=>`<tr><th>${esc(r.lb)}</th><td>${ans(FIELDS[r.ok])}</td><td>${ans(FIELDS[r.not])}</td><td>${ans(FIELDS[r.src])}</td></tr>`).join("")}</table>`; break;
        case "grid": h+=`<table><tr><th>확인할 점</th>${b.cols.map(c=>`<th style="width:18%">${esc(c)}</th>`).join("")}</tr>${b.rows.map(r=>`<tr><td>${esc(r.label)}</td>${r.keys.map(k=>`<td>${esc(plain(k))}</td>`).join("")}</tr>`).join("")}</table>`; break;
        case "judge": h+=`<table><tr><th style="width:12%"></th><th style="width:22%">판단</th><th>가장 중요한 근거</th></tr>${b.rows.map(r=>`<tr><th>${esc(r[0])}</th><td>${esc(get(r[1])||"—")}</td><td>${ans(FIELDS[r[2]])}</td></tr>`).join("")}</table>`; break;
        case "trail": h+=`<table><tr>${b.items.map(it=>`<th>${esc(it[0])}</th>`).join("")}</tr><tr>${b.items.map(it=>{const v=get(it[1]);return `<td>${esc(v&&v.value?v.value.split(" — ")[0]:(typeof v==="string"&&v?v:"—"))}</td>`;}).join("")}</tr></table>`; break;
        case "matrix": h+=`<table><tr><th>확인할 내용</th><th style="width:22%">평가</th></tr>${b.rows.map((r,ri)=>`<tr><td>${esc(r)}</td><td>${esc(get(b.key+"."+ri)||"—")}</td></tr>`).join("")}</table>`; break;
      }
    });
  });
  pv.innerHTML=h+"</div>";
}
function doPrint(){
  const left=STAGES.length-S.locked.length;
  if(left>0&&!confirm(`아직 제출하지 않은 단계가 ${left}개 있습니다. 지금 상태로 PDF를 만들까요?`)) return;
  buildPrint(); setTimeout(()=>window.print(),100);
}
window.addEventListener("beforeprint",buildPrint);

/* =====================================================================
   초기화
   ===================================================================== */
document.getElementById("railUnit").textContent=MODULE.unit;
document.getElementById("railTitle").innerHTML=MODULE.railTitle;
document.getElementById("btnPrint").addEventListener("click",doPrint);
document.getElementById("btnReset").addEventListener("click",()=>{
  if(!confirm("모든 답과 진행 상태가 지워집니다. 처음부터 다시 할까요?")) return;
  if(!confirm("정말 지울까요? 되돌릴 수 없습니다.")) return;
  localStorage.removeItem(KEY); S=blank(); document.getElementById("cls").value=""; document.getElementById("nm").value=""; render(); msg("초기화됨");
});
[["cls","cls"],["nm","name"]].forEach(([id,k])=>{ const el=document.getElementById(id); el.value=S.meta[k]||""; el.addEventListener("input",()=>{ S.meta[k]=el.value; save(); }); });
render();
</script>
